version: '3.8'

services:
  web:
    build: .
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: always

  nginx:
    image: nginx:latest
    container_name: webserver_nginx_3002
    ports:
      - "3002:3002"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - web
    restart: always
