# ─────────────────────────────────────────────────────────────────────────────
#  Nginx — SGA CDLatam
#  Dominio: [DOMINIO] (reemplazar con cd-latam.com en producción)
#
#  Rutas:
#    [DOMINIO]/          → Landing corporativo (HTML estático compilado)
#    [DOMINIO]/sga/      → SGA (React SPA)
#    [DOMINIO]/sga/api/  → API Node.js (tRPC + Express)
#
#  IMPORTANTE: No se usan puertos directos. Todo pasa por Nginx en 80/443.
# ─────────────────────────────────────────────────────────────────────────────

upstream sga_app {
  server sga:3000;
  keepalive 32;
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
server {
  listen 80;
  server_name [DOMINIO] www.[DOMINIO];

  # Ruta para validación de Certbot (Let's Encrypt)
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Todo lo demás → HTTPS
  location / {
    return 301 https://$host$request_uri;
  }
}

# ── HTTPS principal ────────────────────────────────────────────────────────
server {
  listen 443 ssl http2;
  server_name [DOMINIO] www.[DOMINIO];

  # ── SSL (Certbot) ──────────────────────────────────────────────────────
  ssl_certificate     /etc/letsencrypt/live/[DOMINIO]/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/[DOMINIO]/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 10m;

  # ── Headers de seguridad ───────────────────────────────────────────────
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # ── Timeouts y tamaño de body ──────────────────────────────────────────
  proxy_connect_timeout 60s;
  proxy_send_timeout    120s;
  proxy_read_timeout    120s;
  client_max_body_size  20m;

  # ── Gzip ──────────────────────────────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript
             text/xml application/xml text/javascript image/svg+xml;

  # ── API del SGA (/sga/api/) ────────────────────────────────────────────
  location /sga/api/ {
    proxy_pass         http://sga_app;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host $host;
    proxy_set_header   X-Forwarded-Port $server_port;
    proxy_buffering    off;
  }

  # ── SGA completo (/sga/) ──────────────────────────────────────────────
  location /sga/ {
    proxy_pass         http://sga_app;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Forwarded-Host $host;
    proxy_set_header   X-Forwarded-Port $server_port;
  }

  # ── Landing corporativo (/) ────────────────────────────────────────────
  location / {
    root  /var/www/landing;
    index index.html;
    # SPA: cualquier ruta no encontrada → index.html (React Router)
    try_files $uri $uri/ /index.html;

    # Cache de assets estáticos del landing
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
      expires 30d;
      add_header Cache-Control "public, immutable";
    }
  }
}

